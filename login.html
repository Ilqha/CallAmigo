<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CallAmigo</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#e4eee5;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    color:#17231d;
}

/* ================= LOGIN CARD ================= */

.login-box{
    width:420px;
    max-width:100%;
    background:#fffdf8;
    padding:42px;
    border-radius:24px;
    border:1px solid #d4dfd5;
    box-shadow:0 20px 55px rgba(30,70,45,.12);
}

/* ================= HEADING ================= */

h1{
    margin:0 0 9px;
    color:#173c2c;
    font-size:30px;
    letter-spacing:-.5px;
}

.subtitle{
    color:#68756d;
    margin:0 0 28px;
    line-height:1.6;
    font-size:14px;
}

/* ================= FORM ================= */

label{
    display:block;
    margin:17px 0 7px;
    font-weight:600;
    color:#294438;
    font-size:13px;
}

input{
    width:100%;
    padding:13px 14px;
    border:1px solid #ccd8ce;
    border-radius:11px;
    background:#fafcf9;
    color:#17231d;
    font-size:14px;
    outline:none;
    transition:.2s;
}

input:focus{
    border-color:#2c7251;
    box-shadow:0 0 0 3px rgba(44,114,81,.10);
    background:white;
}

input::placeholder{
    color:#9aa59e;
}

/* ================= BUTTON ================= */

button{
    width:100%;
    margin-top:27px;
    padding:14px;
    border:none;
    border-radius:11px;
    background:#1d6244;
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#174d36;
    transform:translateY(-1px);
}

/* ================= MESSAGE ================= */

#message{
    margin-top:15px;
    text-align:center;
    color:#2c7251;
    font-size:13px;
    min-height:18px;
}

/* ================= SIGNUP LINK ================= */

.signup-link{
    margin-top:22px;
    text-align:center;
    color:#737e77;
    font-size:13px;
}

.signup-link a{
    color:#1d6244;
    font-weight:600;
    text-decoration:none;
}

.signup-link a:hover{
    text-decoration:underline;
}

/* ================= MOBILE ================= */

@media(max-width:500px){

    body{
        padding:18px;
    }

    .login-box{
        padding:30px 22px;
        border-radius:20px;
    }

    h1{
        font-size:27px;
    }

}

</style>
</head>

<body>

<div class="login-box">

    <h1>Welcome back 👋</h1>

    <p class="subtitle">
        Log in to continue your CallAmigo practice.
    </p>

    <form id="loginForm">

        <label>Email</label>
        <input
            type="email"
            id="email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            required
        >

        <button type="submit">
            Log In
        </button>

    </form>

    <div id="message"></div>

    <div class="signup-link">
        Don't have an account?
        <a href="signup.html">Create one</a>
    </div>

</div>

<script>

const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");

    try {

        const response = await fetch(
            "https://callamigo.onrender.com/api/auth/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email,
                    password
                })
            }
        );

        const data = await response.json();

        if (response.ok) {

            message.textContent = "Login successful! 🎉";

            localStorage.setItem("token", data.token);
            localStorage.setItem("user", JSON.stringify(data.user));

            if (data.user.setupCompleted) {
               window.location.href = "dashboard.html";
            } else {
              window.location.href = "setup.html";
            }

            /*
             * We haven't created dashboard.html yet.
             * For now, stay on this page so we can verify login.
             */

        } else {

            message.textContent = data.message;

        }

    } catch (error) {

        console.error(error);

        message.textContent =
            "Could not connect to CallAmigo server.";

    }

});

</script>

</body>
</html>
